syntax = "proto3";

package construtor.iam.v1;

option go_package = "github.com/machv4/platform/gen/go/construtor/iam/v1;iamv1";

// Autenticação e avaliação de permissões por componente (RF03, RN03).

message ValidarTokenRequest {
  string jwt = 1;
}

message ValidarTokenResponse {
  bool valido = 1;
  string tenant_id = 2;
  string user_id = 3;
  // dono | parceiro | cliente
  string tipo = 4;
}

message AvaliarPermissoesRequest {
  string sistema_id = 1;
  // Blind indexes dos componentes do ecrã em renderização.
  repeated string blind_indexes = 2;
}

message PermissaoComponente {
  bool view = 1;
  bool click = 2;
}

message AvaliarPermissoesResponse {
  // Mapa booleano final — a lógica das regras nunca sai do servidor (RN03).
  map<string, PermissaoComponente> permissions = 1;
}

// Login social (third-party): o Gateway conduz o fluxo OAuth com o provedor
// (Google/GitHub) e delega ao IAM a materialização da identidade — find-or-create
// do usuário e emissão do JWT MACH. O IAM é o único detentor da chave de assinatura.
message AutenticarThirdPartyRequest {
  // google | github
  string provedor = 1;
  // Identificador estável do usuário no provedor.
  string external_id = 2;
  string email = 3;
  string nome = 4;
}

message AutenticarThirdPartyResponse {
  string jwt = 1;
  string user_id = 2;
  string tenant_id = 3;
  // dono | parceiro | cliente
  string tipo = 4;
}

// Tenants (clientes/negócios) do Frontend autenticado (spec 004, RF07/RF08).
// ListarTenants devolve os filhos diretos do tenant do contexto (RN05: um
// Dono/Parceiro navega para os tenants que ele mesmo criou como clientes);
// CriarTenant insere um novo filho do tipo "cliente" sob o tenant do contexto,
// restrito a dono/parceiro (mesma regra de CriarSistema em 001, RN01).
message Tenant {
  string id = 1;
  string nome = 2;
  // dono | parceiro | cliente
  string tipo = 3;
}

message ListarTenantsRequest {}

message ListarTenantsResponse {
  repeated Tenant tenants = 1;
}

message CriarTenantRequest {
  string nome = 1;
}

message ObterTenantRequest {
  string id = 1;
}

message AtualizarTenantRequest {
  string id = 1;
  string nome = 2;
}

message ExcluirTenantRequest {
  string id = 1;
}

message ExcluirTenantResponse {}

// Auto cadastro (self sign-up, spec 006): visitante cria seu próprio tenant
// (tipo dono) e uma conta autenticada por e-mail/senha — via paralela ao login
// social (AutenticarThirdParty), convergindo no mesmo emissor de JWT MACH.
message RegistrarUsuarioRequest {
  string nome = 1;
  string email = 2;
  string senha = 3;
  // Nome do negócio/tenant a ser criado (RN06).
  string nome_tenant = 4;
}

message RegistrarUsuarioResponse {
  string jwt = 1;
  string user_id = 2;
  string tenant_id = 3;
  // sempre "dono" — quem se cadastra é o dono do próprio tenant (RN01).
  string tipo = 4;
}

// Login por e-mail/senha (spec 006, RF06) de uma conta criada via
// RegistrarUsuario. Falha (e-mail inexistente OU senha incorreta) devolve
// sempre o mesmo erro genérico (RN04) — não distinguir no proto para não
// vazar essa distinção nas mensagens de erro do Gateway.
message AutenticarSenhaRequest {
  string email = 1;
  string senha = 2;
}

message AutenticarSenhaResponse {
  string jwt = 1;
  string user_id = 2;
  string tenant_id = 3;
  // dono | parceiro | cliente
  string tipo = 4;
}

// Dashboard (spec 004, RF04/RF05/RF06): os 3 cards mostram dados agregados
// dos "tenants vinculados" ao usuário autenticado — o tenant do contexto +
// seus filhos diretos (mesmo conjunto de ListarTenants, RN05).

// EventoLogin é uma linha do histórico de login (RF04, RN02).
message EventoLogin {
  string usuario_nome = 1;
  string tenant_nome = 2;
  string criado_em = 3;
}

message ListarUltimosAcessosRequest {}

message ListarUltimosAcessosResponse {
  // Os 10 logins mais recentes dos tenants vinculados, mais recente primeiro.
  repeated EventoLogin eventos = 1;
}

// Feedback é uma mensagem de feedback/reclamação de um tenant vinculado
// (RF05). status: pendente | respondido — a transição respondido→pendente
// nunca é aceita (RN03).
message Feedback {
  string id = 1;
  string tenant_nome = 2;
  string mensagem = 3;
  string status = 4;
  string criado_em = 5;
}

message ListarFeedbackRequest {
  // pendente | respondido; vazio = sem filtro.
  string status = 1;
}

message ListarFeedbackResponse {
  repeated Feedback itens = 1;
}

message AtualizarStatusFeedbackRequest {
  string id = 1;
  // Único valor aceito é "respondido" (RN03).
  string status = 2;
}

// ResumoFinanceiroResponse é a receita agregada do mês corrente dos tenants
// vinculados (RF06, RN04). Nomeado com sufixo Response (em vez de
// ResumoFinanceiro puro) porque o protoc/buf rejeita uma message com o mesmo
// nome do rpc que a devolve (colisão de escopo dentro de service IAMService).
message ResumoFinanceiroResponse {
  int64 receita_total_centavos = 1;
  string moeda = 2;
  // Formato "AAAA-MM" (ex.: "2026-08").
  string competencia = 3;
}

message ResumoFinanceiroRequest {}

// PontoAcessosMensal é a contagem de logins de um mês de competência, usada
// pelo gráfico "Acessos por mês" do card home (RF04-bis). competencia no
// formato "AAAA-MM".
message PontoAcessosMensal {
  string competencia = 1;
  int32 total = 2;
}

message AcessosPorMesRequest {}

message AcessosPorMesResponse {
  // Os últimos 6 meses (incluindo o corrente), mais antigo primeiro,
  // zero-preenchido para meses sem login.
  repeated PontoAcessosMensal pontos = 1;
}

// PontoReceitaMensal é a receita de assinatura agregada de um mês de
// competência, usada pelo gráfico "Receita de assinatura" do card home
// (RF06-bis). competencia no formato "AAAA-MM".
message PontoReceitaMensal {
  string competencia = 1;
  int64 valor_centavos = 2;
}

message ReceitaPorMesRequest {}

message ReceitaPorMesResponse {
  // Os últimos 6 meses (incluindo o corrente), mais antigo primeiro,
  // zero-preenchido para meses sem assinatura registrada.
  repeated PontoReceitaMensal pontos = 1;
  string moeda = 2;
}

// Área "Conta/Configuração" (spec 004-reestruturacao-ia-navegacao, RF14-RF18):
// perfil, troca de senha, MFA TOTP em duas etapas, exclusão de conta (LGPD,
// anonimização) e troca de e-mail em duas etapas. Todas as rotas operam sobre
// o usuário autenticado (user_id do TenantContext), nunca sobre um id do corpo.

message AtualizarPerfilRequest {
  string nome = 1;
  string foto_url = 2;
}

message AtualizarPerfilResponse {}

// RNF02: senha_atual é o mecanismo de reautenticação — validado via bcrypt
// contra o hash já persistido antes de qualquer troca.
message AtualizarSenhaRequest {
  string senha_atual = 1;
  string senha_nova = 2;
}

message AtualizarSenhaResponse {}

message AtivarMfaRequest {}

// segredo_otp_auth_uri é de exibição única (RNF01): não existe endpoint de
// releitura — se perdido, o usuário precisa reiniciar o fluxo de ativação.
message AtivarMfaResponse {
  string segredo_otp_auth_uri = 1;
}

message ConfirmarMfaRequest {
  string codigo = 1;
}

message ConfirmarMfaResponse {}

// Decisão de segurança (diverge do contrato assumido em contracts/api.md):
// desativar MFA também exige reautenticação por senha — evita que uma sessão
// sequestrada desligue o segundo fator sem confirmar a senha.
message DesativarMfaRequest {
  string senha_atual = 1;
}

message DesativarMfaResponse {}

// RN07: bloqueada se o tenant do usuário tiver 1+ tenants filhos vinculados.
// RNF02: senha_atual reautentica antes da anonimização (LGPD, não é DELETE físico).
message ExcluirContaRequest {
  string senha_atual = 1;
}

message ExcluirContaResponse {}

// RN08: `email` (login) só muda na confirmação — o POST inicial grava apenas
// email_pendente e envia o token de confirmação (fora de escopo o envio real
// por e-mail; ver services/iam/internal/server, log.Printf documentado).
message SolicitarTrocaEmailRequest {
  string novo_email = 1;
}

message SolicitarTrocaEmailResponse {}

message ConfirmarTrocaEmailRequest {
  string token = 1;
}

message ConfirmarTrocaEmailResponse {}

service IAMService {
  rpc ValidarToken(ValidarTokenRequest) returns (ValidarTokenResponse);
  rpc AvaliarPermissoes(AvaliarPermissoesRequest) returns (AvaliarPermissoesResponse);
  rpc AutenticarThirdParty(AutenticarThirdPartyRequest) returns (AutenticarThirdPartyResponse);
  rpc ListarTenants(ListarTenantsRequest) returns (ListarTenantsResponse);
  rpc CriarTenant(CriarTenantRequest) returns (Tenant);
  rpc ObterTenant(ObterTenantRequest) returns (Tenant);
  rpc AtualizarTenant(AtualizarTenantRequest) returns (Tenant);
  rpc ExcluirTenant(ExcluirTenantRequest) returns (ExcluirTenantResponse);
  rpc RegistrarUsuario(RegistrarUsuarioRequest) returns (RegistrarUsuarioResponse);
  rpc AutenticarSenha(AutenticarSenhaRequest) returns (AutenticarSenhaResponse);
  rpc ListarUltimosAcessos(ListarUltimosAcessosRequest) returns (ListarUltimosAcessosResponse);
  rpc ListarFeedback(ListarFeedbackRequest) returns (ListarFeedbackResponse);
  rpc AtualizarStatusFeedback(AtualizarStatusFeedbackRequest) returns (Feedback);
  rpc ResumoFinanceiro(ResumoFinanceiroRequest) returns (ResumoFinanceiroResponse);
  rpc AtualizarPerfil(AtualizarPerfilRequest) returns (AtualizarPerfilResponse);
  rpc AtualizarSenha(AtualizarSenhaRequest) returns (AtualizarSenhaResponse);
  rpc AtivarMfa(AtivarMfaRequest) returns (AtivarMfaResponse);
  rpc ConfirmarMfa(ConfirmarMfaRequest) returns (ConfirmarMfaResponse);
  rpc DesativarMfa(DesativarMfaRequest) returns (DesativarMfaResponse);
  rpc ExcluirConta(ExcluirContaRequest) returns (ExcluirContaResponse);
  rpc SolicitarTrocaEmail(SolicitarTrocaEmailRequest) returns (SolicitarTrocaEmailResponse);
  rpc ConfirmarTrocaEmail(ConfirmarTrocaEmailRequest) returns (ConfirmarTrocaEmailResponse);
  rpc AcessosPorMes(AcessosPorMesRequest) returns (AcessosPorMesResponse);
  rpc ReceitaPorMes(ReceitaPorMesRequest) returns (ReceitaPorMesResponse);
}
