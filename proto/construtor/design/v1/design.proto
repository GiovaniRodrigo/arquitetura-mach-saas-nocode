syntax = "proto3";

package construtor.design.v1;

option go_package = "github.com/machv4/platform/gen/go/construtor/design/v1;designv1";

// CRUD da árvore recursiva (padrão Composite) e persistência em lote
// da colaboração write-behind (RF01, RN06).

message Componente {
  string blind_index = 1;
  string tipo = 2;
  // JSON serializado das propriedades do componente.
  bytes propriedades = 3;
  // Padrão Composite: filhos recursivos.
  repeated Componente componente_filhos = 4;
}

message Design {
  string id = 1;
  string sistema_id = 2;
  string nome = 3;
  Componente arvore = 4;
}

message ObterDesignRequest {
  string id = 1;
}

message SalvarDesignRequest {
  // Payload consolidado enviado pelo motor Elixir após o debounce de 5s (RN06).
  Design design = 1;
}

message SalvarDesignResponse {
  bool sucesso = 1;
}

message RemoverResponse {
  bool sucesso = 1;
}

// Sistema criado pelo utilizador, isolado por tenant (RN01). É o contêiner ao
// qual os designs e as versões publicadas pertencem.
message Sistema {
  string id = 1;
  string nome = 2;
}

message CriarSistemaRequest {
  string nome = 1;
}

message ListarSistemasRequest {
  // Opcional: quando preenchido, lista os sistemas deste tenant (não o do
  // contexto/Metadata) — usado pelo Gateway em RF08, após validar via IAM que
  // o tenant é filho direto do tenant do contexto (RN05). Vazio preserva o
  // comportamento atual (tenant do contexto). O Design Engine NÃO valida
  // hierarquia aqui: confia que quem chamou já autorizou (ver grpc.go).
  string tenant_id = 1;
}

message ListarSistemasResponse {
  repeated Sistema sistemas = 1;
}

message AtualizarWhiteLabelRequest {
  string logo_url = 1;
  string cor_primaria = 2;
  string cor_secundaria = 3;
  string dominio_proprio = 4;
}

// WhiteLabel espelha a personalização de marca do tenant (RF13, RNF03). A
// validação de dominio_proprio é assíncrona e fora de escopo: dominio_validado
// é sempre false nesta entrega.
message WhiteLabel {
  string logo_url = 1;
  string cor_primaria = 2;
  string cor_secundaria = 3;
  string dominio_proprio = 4;
  bool dominio_validado = 5;
}

service DesignEngineService {
  rpc CriarDesign(Design) returns (Design);
  rpc ObterDesign(ObterDesignRequest) returns (Design);
  rpc AtualizarDesign(Design) returns (Design);
  rpc RemoverDesign(ObterDesignRequest) returns (RemoverResponse);
  // Chamada única em lote da colaboração (write-behind).
  rpc SalvarDesign(SalvarDesignRequest) returns (SalvarDesignResponse);
  // Descoberta/criação de sistemas do tenant, consumida pelo seletor do Frontend
  // (RN01). Criar é restrito a dono/parceiro; listar é aberto ao tenant.
  rpc CriarSistema(CriarSistemaRequest) returns (Sistema);
  rpc ListarSistemas(ListarSistemasRequest) returns (ListarSistemasResponse);
  // Personalização de marca do tenant (RF13, RNF03).
  rpc AtualizarWhiteLabel(AtualizarWhiteLabelRequest) returns (WhiteLabel);
}
