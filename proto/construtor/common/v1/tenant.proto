syntax = "proto3";

package construtor.common.v1;

option go_package = "github.com/machv4/platform/gen/go/construtor/common/v1;commonv1";

// TenantContext trafega exclusivamente como Metadata binário gRPC
// (chave "x-tenant-context-bin") — RNF02 / RN01.
// NUNCA deve ser incluído no corpo de mensagens de negócio.
message TenantContext {
  string tenant_id = 1;
  string user_id = 2;
  // dono | parceiro | cliente
  string tipo = 3;
  // W3C tracestate propagado junto ao contexto de identidade (RNF04).
  string trace_state = 4;
}
