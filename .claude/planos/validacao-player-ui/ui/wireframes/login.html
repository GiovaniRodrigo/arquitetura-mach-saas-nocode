<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wireframe — Login (player MACH /ui)</title>
<style>
  :root{
    --color-primary:#6366F1; --color-primary-600:#4F46E5;
    --color-bg:#F8FAFC; --color-surface:#FFFFFF; --color-border:#E2E8F0;
    --color-text:#0F172A; --color-text-2:#475569; --color-text-3:#94A3B8;
    --radius:12px; --radius-sm:8px; --space:8px; --tap-min:44px;
    --font-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;
       background:linear-gradient(160deg,#EEF2FF 0%,#F8FAFC 60%);
       font-family:var(--font-ui);color:var(--color-text)}
  /* data-principle="conteudo-obvio": card centrado com identidade de marca */
  .card{background:var(--color-surface);width:min(400px,92vw);padding:32px;
        border:1px solid var(--color-border);border-radius:var(--radius);
        box-shadow:0 10px 30px rgba(15,23,42,.08)}
  .brand{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:20px}
  .logo{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;
        background:var(--color-primary);color:#fff;font-weight:700;font-size:22px}
  h1{font-size:1.5rem;margin:4px 0 0}
  .sub{color:var(--color-text-2);font-size:.9rem;margin:0;text-align:center}
  .methods{display:flex;flex-direction:column;gap:12px;margin-top:24px}
  /* data-principle="inicio-obvio": Google = CTA primário (preenchido) */
  .btn{min-height:var(--tap-min);display:flex;align-items:center;justify-content:center;gap:10px;
       border-radius:var(--radius-sm);font-size:.95rem;font-weight:600;cursor:pointer;
       text-decoration:none;border:1px solid transparent;transition:.15s}
  .btn svg{width:18px;height:18px}
  /* data-principle="convencao": botão Google segue guideline (branco+borda, G colorido) */
  .btn-google{background:#fff;border-color:#DADCE0;color:#3C4043}
  .btn-google:hover{background:#F8FAFC;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .btn-google:focus-visible{outline:3px solid #C7D2FE;outline-offset:2px}
  /* data-principle="convencao": GitHub secundário (mark oficial, preto) */
  .btn-github{background:#24292F;color:#fff}
  .btn-github:hover{background:#1b1f24}
  .btn-github:focus-visible{outline:3px solid #94A3B8;outline-offset:2px}
  .foot{margin-top:20px;text-align:center;color:var(--color-text-3);font-size:.75rem}
  @media (max-width:420px){.card{padding:24px}}
</style>
</head>
<body>
  <!-- Wireframe de fidelidade média — anotações via data-principle -->
  <main class="card" role="main">
    <div class="brand" data-principle="assunto-obvio">
      <div class="logo">M</div>
      <h1>Plataforma MACH</h1>
      <p class="sub">Entre para acessar seus sistemas.</p>
    </div>
    <div class="methods" data-principle="inicio-obvio">
      <a class="btn btn-google" href="#" data-principle="convencao-google">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.2 13.3 17.6 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.5 3-2.2 5.5-4.7 7.2l7.3 5.7c4.3-4 6.7-9.9 6.7-17.4z"/>
          <path fill="#FBBC05" d="M10.4 28.3c-.5-1.5-.8-3.1-.8-4.8s.3-3.3.8-4.8l-7.8-6.1C.9 15.9 0 19.8 0 23.5s.9 7.6 2.6 10.9l7.8-6.1z"/>
          <path fill="#34A853" d="M24 47c6.2 0 11.5-2 15.3-5.6l-7.3-5.7c-2 1.4-4.7 2.3-8 2.3-6.4 0-11.8-3.8-13.6-9.3l-7.8 6.1C6.5 42.6 14.6 47 24 47z"/>
        </svg>
        Continuar com Google
      </a>
      <a class="btn btn-github" href="#" data-principle="convencao-github">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        Continuar com GitHub
      </a>
    </div>
    <p class="foot">Ao entrar você concorda com os termos de uso da plataforma.</p>
  </main>
</body>
</html>
