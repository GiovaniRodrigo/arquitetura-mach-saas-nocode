<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wireframe — Estados (loading / empty / erro)</title>
<style>
  :root{
    --color-primary:#6366F1; --color-primary-600:#4F46E5;
    --color-bg:#F8FAFC; --color-surface:#FFFFFF; --color-border:#E2E8F0;
    --color-text:#0F172A; --color-text-2:#475569; --color-text-3:#94A3B8;
    --color-error:#DC2626; --color-error-bg:#FEE2E2;
    --radius:12px; --radius-sm:8px; --tap-min:44px;
    --font-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--color-bg);font-family:var(--font-ui);color:var(--color-text);padding:24px}
  h2.sec{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--color-text-3);margin:28px 0 8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius);padding:24px;min-height:220px;display:flex;flex-direction:column}
  .btn{min-height:var(--tap-min);padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
       border-radius:var(--radius-sm);font-weight:600;font-size:.9rem;cursor:pointer;border:1px solid transparent;text-decoration:none}
  .btn-primary{background:var(--color-primary);color:#fff}
  .btn-primary:hover{background:var(--color-primary-600)}
  .btn-ghost{background:#fff;border-color:var(--color-border);color:var(--color-text-2)}

  /* data-principle="feedback": skeleton em vez de spinner genérico */
  .sk{background:linear-gradient(90deg,#EEF2F7 25%,#E2E8F0 37%,#EEF2F7 63%);
      background-size:400% 100%;animation:sh 1.4s ease infinite;border-radius:8px}
  @keyframes sh{0%{background-position:100% 0}100%{background-position:-100% 0}}
  .sk-line{height:14px;margin:10px 0}
  .sk-title{height:22px;width:55%;margin-bottom:16px}
  .sk-btn{height:40px;width:140px;margin-top:auto}

  /* empty state */
  .empty{align-items:center;justify-content:center;text-align:center;gap:6px}
  .empty .ic{width:56px;height:56px;border-radius:14px;background:#EEF2FF;color:var(--color-primary);display:grid;place-items:center;font-size:26px;margin-bottom:8px}
  .muted{color:var(--color-text-2);font-size:.9rem;margin:2px 0 14px}

  /* error state — data-principle="reversao-clara": retry + voltar */
  .err .ic{width:56px;height:56px;border-radius:14px;background:var(--color-error-bg);color:var(--color-error);display:grid;place-items:center;font-size:26px;margin-bottom:8px}
  .err-code{font-family:"JetBrains Mono",monospace;font-size:.78rem;color:var(--color-text-3);background:#F1F5F9;padding:6px 10px;border-radius:6px;margin:6px 0 14px;word-break:break-all}
  .row{display:flex;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
  <h2 class="sec">Estados da casca do player (redesenhados)</h2>
  <div class="grid">

    <!-- LOADING -->
    <section class="panel" data-principle="feedback-skeleton" aria-busy="true" aria-label="Carregando">
      <div class="sk sk-title"></div>
      <div class="sk sk-line"></div>
      <div class="sk sk-line" style="width:90%"></div>
      <div class="sk sk-line" style="width:75%"></div>
      <div class="sk sk-btn"></div>
    </section>

    <!-- EMPTY / SEM SISTEMA -->
    <section class="panel empty" data-principle="conteudo-sem-jargao">
      <div class="ic">📁</div>
      <strong>Autenticado ✓</strong>
      <p class="muted">Nenhum sistema selecionado. Escolha um sistema para começar.</p>
      <a class="btn btn-primary" href="#">Selecionar sistema</a>
    </section>

    <!-- ERRO -->
    <section class="panel err empty" role="alert" data-principle="reversao-clara">
      <div class="ic">⚠️</div>
      <strong>Não foi possível carregar</strong>
      <p class="muted">Ocorreu um erro ao buscar a versão ativa do sistema.</p>
      <div class="err-code">Error: failed to fetch /api/versao-ativa (500)</div>
      <div class="row">
        <button class="btn btn-primary">Tentar novamente</button>
        <a class="btn btn-ghost" href="#">Voltar ao login</a>
      </div>
    </section>

  </div>
</body>
</html>
