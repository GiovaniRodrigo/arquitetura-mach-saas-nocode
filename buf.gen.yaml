version: v2
clean: true
plugins:
  # --- Go (mensagens + gRPC) — consumido pelos serviços e Gateway ---
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: gen/go
    opt: paths=source_relative

  # --- TypeScript — consumido pelo Frontend via Gateway ---
  - remote: buf.build/bufbuild/es
    out: gen/ts
    opt: target=ts

  # --- Elixir (mensagens + gRPC) — consumido pelo motor de colaboração (Fase 6) ---
  # Plugin local `protoc-gen-elixir` (escript do pacote hex `protobuf`), instalado
  # com `mix escript.install hex protobuf` e disponível no PATH
  # ($HOME/.mix/escripts). opt=plugins=grpc gera também os stubs de serviço.
  - local: protoc-gen-elixir
    out: gen/elixir
    opt:
      - plugins=grpc
