version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    - PACKAGE_VERSION_SUFFIX
    # Os contratos oficiais (specs/.../contracts/interfaces.md) reusam tipos de
    # domínio (Design, Regra, Job) como request/response — decisão de contrato,
    # não acidente. Relaxamos as convenções de nomenclatura correspondentes.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
