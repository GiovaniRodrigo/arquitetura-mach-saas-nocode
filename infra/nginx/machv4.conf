# Nginx do MACH V4 (spec 002, task 6): serve o player estático a partir do release
# ativo e faz proxy reverso para o Gateway (HTTP :8080) e para o WebSocket de
# colaboração do collab (Phoenix :4000). TLS é terminado aqui (certs fora do repo).

upstream machv4_gateway { server 127.0.0.1:8080; }
upstream machv4_collab  { server 127.0.0.1:4000; }

server {
    listen 80;
    server_name _;

    # --- Player: bundle estático servido do release ativo (SPA) --------------
    root /opt/machv4/current/player;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # rotas SPA caem no index (RN04 spec 001)
    }

    # Ativos com hash no nome podem ser cacheados agressivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- API: proxy ao Gateway ----------------------------------------------
    location /api/ {
        proxy_pass http://machv4_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Healthcheck do Gateway exposto para o smoke test (contrato §6).
    location = /healthz {
        proxy_pass http://machv4_gateway/health;
    }

    # --- Colaboração em tempo real: WebSocket do Phoenix (RF06 spec 001) -----
    location /socket/ {
        proxy_pass http://machv4_collab;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
