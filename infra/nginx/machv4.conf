# Nginx do host GF Code (spec 002 + 003): serve o site institucional estático em
# gfcode.com.br e o app MACH sob /app (player + proxy /api e /auth ao Gateway,
# /socket ao collab). TLS terminado aqui (Let's Encrypt via webroot). O
# nginx-proxy legado (container) foi substituído por este vhost no host.

upstream machv4_gateway { server 127.0.0.1:8080; }
upstream machv4_collab  { server 127.0.0.1:4000; }

# HTTP: desafio ACME (renovação de certificado) + redirect para HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name gfcode.com.br www.gfcode.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot-webroot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gfcode.com.br www.gfcode.com.br;

    ssl_certificate     /etc/letsencrypt/live/gfcode.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gfcode.com.br/privkey.pem;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Site institucional (estático) na raiz -------------------------------
    root /var/www/site-institucional;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Player MACH (SPA sob /app) ------------------------------------------
    location = /app { return 301 /app/; }
    location /app/ {
        alias /opt/machv4/current/player/;
        try_files $uri /app/index.html;
    }

    # --- API REST → Gateway ---------------------------------------------------
    location /api/ {
        proxy_pass http://machv4_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Login social (OAuth) → Gateway --------------------------------------
    location /auth/ {
        proxy_pass http://machv4_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket de colaboração em tempo real → collab ---------------------
    location /socket/ {
        proxy_pass http://machv4_collab;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
