          env:
            - { name: DATABASE_URL, value: "postgres://mach:mach@postgres:5432/machv4?sslmode=disable" }
---
apiVersion: v1
kind: Service
metadata: { name: deploy, namespace: machv4 }
spec:
  selector: { app: deploy }
