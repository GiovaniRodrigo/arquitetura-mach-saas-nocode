---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collab
  namespace: machv4
  labels: { app: collab }
spec:
  replicas: 1
  selector: { matchLabels: { app: collab } }
  template:
    metadata: { labels: { app: collab } }
    spec:
      containers:
        - name: collab
          image: machv4/collab:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4000 }]
          env:
            - { name: DESIGN_GRPC_ADDR, value: "design:50052" }
            - { name: REDIS_URL, value: "redis://redis:6379" }
            - { name: PHX_HOST, value: "collab" }
            - { name: PORT, value: "4000" }
            # Sem isto, o Phoenix.Socket rejeita o handshake WebSocket do
            # Vite dev server (Origin http://localhost:5183) porque o
            # check_origin default só aceita Origin == PHX_HOST ("collab").
            # A tela do editor fica presa em "Carregando tela..." para
            # sempre, sem erro visível, pois o join do canal nunca chega
            # a ser enviado.
            - { name: PHX_CHECK_ORIGIN, value: "http://localhost:5183" }
            - name: SECRET_KEY_BASE
              valueFrom: { secretKeyRef: { name: collab-secrets, key: SECRET_KEY_BASE } }
            # Chave pública RS256 do IAM (par gerado por ensure_secret
            # jwt-keys no dev-up.sh) — sem isto, Collab.Auth.Token.verify/1
            # sempre falha com :sem_chave_publica e nenhuma ligação
            # WebSocket é autenticada (lib/collab/auth/token.ex:29-32).
            - name: JWT_PUBLIC_KEY_PEM
              valueFrom: { secretKeyRef: { name: jwt-keys, key: public.pem } }
---
apiVersion: v1
kind: Service
metadata: { name: collab, namespace: machv4 }
spec:
  selector: { app: collab }
  # NodePort (não ClusterIP): o Frontend fala com o Collab via WebSocket
  # direto do host (vite.config.ts proxy /socket -> localhost:4000), fora do
  # cluster — precisa estar alcançável de fora, como o Gateway.
  type: NodePort
  ports: [{ port: 4000, targetPort: 4000, nodePort: 30400 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: machv4
  labels: { app: gateway }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      serviceAccountName: gateway
      containers:
        - name: gateway
          image: machv4/gateway:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          env:
            - { name: IAM_GRPC_ADDR, value: "iam:50051" }
            - { name: DESIGN_GRPC_ADDR, value: "design:50052" }
            - { name: LOGIC_GRPC_ADDR, value: "logic:50053" }
            - { name: DEPLOY_GRPC_ADDR, value: "deploy:50054" }
            - { name: EXPORT_GRPC_ADDR, value: "export:50055" }
            # K8S_NAMESPACE/LINKERD_PROMETHEUS_URL usam os defaults do próprio
            # main.go (namespace "machv4", Prometheus do linkerd-viz via DNS
            # interno) — sem necessidade de sobrescrever aqui.
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: machv4
spec:
  selector: { app: gateway }
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
