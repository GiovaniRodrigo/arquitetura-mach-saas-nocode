# Os 8 serviços da plataforma MACH V4 monitorados pela tela Monitor de
# Recursos (spec 008) — agora rodando em Kubernetes com sidecar Linkerd
# injetado automaticamente via anotação do namespace (spec 009). CPU/memória
# vêm do metrics-server (metrics.k8s.io); RPS/latência/taxa de sucesso por
# serviço vêm do Prometheus do linkerd-viz — nenhum dos 8 precisa expor uma
# RPC de "recursos" própria, o mesh instrumenta de fora.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam
  namespace: machv4
  labels: { app: iam }
spec:
  replicas: 1
  selector: { matchLabels: { app: iam } }
  template:
    metadata: { labels: { app: iam } }
    spec:
      containers:
        - name: iam
          image: machv4/iam:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 50051 }]
          env:
            - { name: DATABASE_URL, value: "postgres://mach:mach@postgres:5432/machv4?sslmode=disable" }
            - name: IAM_MFA_ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: iam-secrets, key: IAM_MFA_ENCRYPTION_KEY } }
            # Sem isto, o IAM cai no fallback de dev (loadPrivateKey em
            # cmd/main.go): gera um par RSA efêmero a cada boot, que nenhum
            # outro serviço conhece. O Collab (que verifica o JWT localmente,
            # ao contrário do Gateway) nunca consegue validar nada nesse
            # cenário — toda ligação WebSocket é recusada.
            - { name: JWT_PRIVATE_KEY_PATH, value: "/etc/jwt/private.pem" }
          volumeMounts:
            - { name: jwt-keys, mountPath: /etc/jwt, readOnly: true }
      volumes:
        - name: jwt-keys
          secret: { secretName: jwt-keys }
---
apiVersion: v1
kind: Service
metadata: { name: iam, namespace: machv4 }
spec:
  selector: { app: iam }
  ports: [{ port: 50051, targetPort: 50051 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: design
  namespace: machv4
  labels: { app: design }
spec:
  replicas: 1
  selector: { matchLabels: { app: design } }
  template:
    metadata: { labels: { app: design } }
    spec:
      containers:
        - name: design
          image: machv4/design:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 50052 }]
          env:
            - { name: DATABASE_URL, value: "postgres://mach:mach@postgres:5432/machv4?sslmode=disable" }
---
apiVersion: v1
kind: Service
metadata: { name: design, namespace: machv4 }
spec:
  selector: { app: design }
  ports: [{ port: 50052, targetPort: 50052 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logic
  namespace: machv4
  labels: { app: logic }
spec:
