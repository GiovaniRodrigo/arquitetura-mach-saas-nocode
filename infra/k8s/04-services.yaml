          ports: [{ containerPort: 50053 }]
          env:
            - { name: DATABASE_URL, value: "postgres://mach:mach@postgres:5432/machv4?sslmode=disable" }
            - { name: RABBITMQ_URL, value: "amqp://mach:mach@rabbitmq:5672/" }
---
apiVersion: v1
kind: Service
metadata: { name: logic, namespace: machv4 }
spec:
  selector: { app: logic }
  ports: [{ port: 50053, targetPort: 50053 }]
---
