---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: export
  namespace: machv4
  labels: { app: export }
spec:
  replicas: 1
  selector: { matchLabels: { app: export } }
  template:
    metadata: { labels: { app: export } }
    spec:
      containers:
        - name: export
          image: machv4/export:dev
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 50055 }]
          env:
            - { name: DATABASE_URL, value: "postgres://mach:mach@postgres:5432/machv4?sslmode=disable" }
            - { name: S3_ENDPOINT, value: "minio:9000" }
            - { name: S3_ACCESS_KEY, value: "mach" }
            - { name: S3_SECRET_KEY, value: "machsecret" }
            - { name: S3_BUCKET, value: "exports" }
            - { name: S3_USE_SSL, value: "false" }
---
apiVersion: v1
kind: Service
metadata: { name: export, namespace: machv4 }
spec:
  selector: { app: export }
  ports: [{ port: 50055, targetPort: 50055 }]
---
